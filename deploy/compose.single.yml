name: wiselib
services:
  mongo-single:
    image: mongo:7.0
    container_name: lib-mongo-single
    command: ["mongod", "--dbpath", "/data/db", "--port", "27017",
              "--bind_ip_all", "--auth", "--directoryperdb"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - ../data/single:/data/db
    networks:
      - libnet
    restart: unless-stopped
networks:
  libnet:
    external: true
    name: libnet
